[project]
name = "smartspeaking-backend"
version = "0.1.0"
description = "SmartSpeaking API, worker and analysis pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "rq>=1.16",
    "faster-whisper>=1.1",
    "praat-parselmouth>=0.4.7",
    "pyyaml>=6.0.3",
    "numpy>=2.4.6",
    "mediapipe>=1.2.2",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "phonemizer>=3.6.0",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: slow end-to-end tests that load real models",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# Coaching copy and test fixtures read better as one line each.
"app/pipeline/report.py" = ["E501"]
# SVG and HTML markup strings.
"app/services/charts.py" = ["E501"]
"app/services/pdf.py" = ["E501"]
"tests/**" = ["E501"]
