# German lexicon for the language step. Phrases are matched on whole normalized
# words (lowercase, no punctuation), longest first.

# Whisper drops fillers unless the prompt is written in a disfluent style.
whisper_prompt: >-
  Ähm, also, äh, ich hab halt, sag ich mal, so überlegt. Hm, eigentlich,
  ich meine, das ist, äh, sozusagen... genau, okay, ähm, ich fang mal an.

fillers:
  # Always counted as fillers.
  always:
    - äh
    - ähm
    - ääh
    - öh
    - öhm
    - eh
    - ehm
    - hm
    - hmm
    - mhm
    - halt
    - sozusagen
    - quasi
    - irgendwie
    - eigentlich
    - praktisch
    - sag ich mal
    - ich sag mal
    - ich meine
    - weißt du
    - weißte
    - na ja
    - naja
    - oder so
  # Counted only at the start of a sentence and followed by a comma ("Also, ...").
  contextual:
    - also
    - so
    - ja
    - genau
    - gut
    - okay
    - tja

hedges:
  - ich bin mir nicht sicher
  - ich weiß nicht
  - in gewisser weise
  - mehr oder weniger
  - unter umständen
  - ich würde sagen
  - ein bisschen
  - ein wenig
  - ich glaube
