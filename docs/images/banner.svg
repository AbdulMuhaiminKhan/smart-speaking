    <ellipse cx="945" cy="154" rx="11" ry="7.5" transform="rotate(-22 945 154)" fill="none"/>
    <ellipse cx="1040" cy="143" rx="11" ry="7.5" transform="rotate(-22 1040 143)"/>
    <ellipse cx="1095" cy="132" rx="11" ry="7.5" transform="rotate(-22 1095 132)"/>
  </g>
  <text x="560" y="90" fill="#cfd8f5" font-family="Iowan Old Style, Charter, Palatino, Georgia, serif" font-style="italic" font-weight="700" font-size="26">Moderato</text>
