    <line x1="560" x2="1140" y1="198" y2="198"/>
    <line x1="705" x2="705" y1="110" y2="198"/>
    <line x1="850" x2="850" y1="110" y2="198"/>
    <line x1="995" x2="995" y1="110" y2="198"/>
  </g>
  <line x1="1140" x2="1140" y1="110" y2="198" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4"/>
  <g fill="#e6c36a" stroke="#e6c36a" stroke-width="2.4">
